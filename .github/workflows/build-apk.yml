name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Scaffold Official Flutter Android Project
        working-directory: mobile_app
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          rm -rf android
          flutter create --platforms=android --org ae.goldenbloom --project-name goldenbloom_crm .
          cp pubspec.yaml.bak pubspec.yaml
          cp main.dart.bak lib/main.dart

      - name: Configure Android Manifest & Desugaring
        working-directory: mobile_app
        run: |
          python3 configure_android.py

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile_app
        run: |
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log || (echo "=== FAILURE LOG ===" && tail -n 120 build.log && exit 1)

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goldenbloom-crm-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Setup SSH & Deploy APK to Portal
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            cat << 'EOF' > ~/.ssh/config
            Host hostinger
              HostName ${{ secrets.HOSTINGER_HOST }}
              Port ${{ secrets.HOSTINGER_PORT || '22' }}
              User ${{ secrets.HOSTINGER_USER }}
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ServerAliveInterval 30
            EOF

            ssh hostinger "mkdir -p /home/${{ secrets.HOSTINGER_USER }}/domains/crm.goldenbloom.ae/public_html/downloads"
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              mobile_app/build/app/outputs/flutter-apk/app-release.apk \
              hostinger:/home/${{ secrets.HOSTINGER_USER }}/domains/crm.goldenbloom.ae/public_html/downloads/goldenbloom-crm.apk
          fi
